name: Deploy auf schondraussen.de
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: lftp installieren
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get -o Acquire::Retries=2 -o Acquire::ForceIPv4=true update -qq && timeout 120 sudo apt-get -o Acquire::ForceIPv4=true install -y -qq lftp; then break; fi
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 10 Sekunden"; sleep 10
          done
          command -v lftp
      - name: Per FTPS auf den Webspace laden
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          cd "$FTP_DIR"
          mirror -R --verbose --parallel=1 --exclude config.php --exclude-glob .git* ./public .
          bye
          EOF
