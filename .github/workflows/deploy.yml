name: Deploy auf schondraussen.de
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, auf einen festen Commit gesetzt
      - name: lftp installieren (falls das Netz des Runners es erlaubt)
        run: |
          timeout 150 bash -c 'sudo apt-get -o Acquire::Retries=1 -o Acquire::ForceIPv4=true update -qq && sudo apt-get -o Acquire::ForceIPv4=true install -y -qq lftp' || echo "lftp nicht installierbar, es wird das Python-Skript benutzt"
      - name: Per FTPS auf den Webspace laden
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if command -v lftp >/dev/null; then
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          cd "$FTP_DIR"
          mirror -R --verbose --parallel=1 --exclude config.php --exclude-glob .git* ./public .
          bye
          EOF
          else
            python3 scripts/deploy_ftps.py public
          fi
      - name: Wartungsdatei entfernen, falls noch eine vorhanden ist (Wartungsmodus beim Deploy ist abgeschaltet, 17.11.2026)
        if: always()
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python3 scripts/maintenance_ftps.py off
